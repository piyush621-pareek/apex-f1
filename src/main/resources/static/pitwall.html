<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APEX F1 — Pit Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="pitwall">

  <header class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">APEX<span class="brand-name-accent">F1</span></span>
      </a>
      <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
      <nav class="nav-links">
        <a href="dashboard.html" class="nav-link" data-page="dashboard">Dashboard</a>
        <a href="pitwall.html" class="nav-link" data-page="pitwall">Pit Wall</a>
        <a href="fsp.html" class="nav-link" data-page="fsp">FSP</a>
        <a href="manage.html" class="nav-link" data-page="manage">Manage</a>
      </nav>
      <div class="season-badge"><span class="season-dot"></span>2026 SEASON</div>
    </div>
  </header>

  <main class="page-container">
    <section class="panel">
      <h1>Pit Wall</h1>
      <p class="text-secondary">Lap times, telemetry and weather for each session of a race weekend.</p>
      <div class="controls">
        <div class="field">
          <label for="race-select">Race</label>
          <select id="race-select"></select>
        </div>
        <div class="field">
          <label for="session-select">Session</label>
          <select id="session-select"></select>
        </div>
        <div class="field">
          <label for="driver-select">Driver (telemetry)</label>
          <select id="driver-select"></select>
        </div>
      </div>
      <div id="track-wrap" style="margin:16px 0;"></div>
      <div id="weather-row" class="grid grid-2"></div>
    </section>

    <section class="panel">
      <h2>Lap Times</h2>
      <div id="laptimes"><div class="state-msg">Select a session…</div></div>
    </section>

    <section class="panel">
      <h2>Telemetry</h2>
      <div id="telemetry"><div class="state-msg">Select a driver…</div></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>APEX F1 — F1 Telemetry Analytics · 2026 Season</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script>
    const raceSel = document.getElementById('race-select');
    const sessionSel = document.getElementById('session-select');
    const driverSel = document.getElementById('driver-select');

    let racesCache = [];

    function showTrack() {
      const r = racesCache.find(x => String(x.id) === String(raceSel.value));
      const wrap = document.getElementById('track-wrap');
      const c = r && r.circuit;
      if (c && c.mapImageUrl) {
        wrap.innerHTML = `<img src="${c.mapImageUrl}" alt="${c.name}" class="track-map">
          <div class="text-secondary" style="margin-top:6px;font-size:0.85rem;">
            ${c.name} · ${c.city || ''}${c.country ? ', ' + c.country : ''} · ${c.lengthKm ?? '—'} km · ${c.totalLaps ?? '—'} laps</div>`;
      } else {
        wrap.innerHTML = '';
      }
    }

    async function init() {
      try {
        const [races, drivers] = await Promise.all([
          apiGet(`/races?season=${SEASON}`),
          apiGet('/drivers'),
        ]);
        racesCache = races;
        raceSel.innerHTML = races.map(r => `<option value="${r.id}">R${r.round} — ${r.name}</option>`).join('');
        driverSel.innerHTML = drivers.map(d => `<option value="${d.id}">${d.code} — ${d.fullName}</option>`).join('');
        raceSel.onchange = () => { showTrack(); loadSessions(); };
        sessionSel.onchange = () => { loadLapTimes(); loadWeather(); };
        driverSel.onchange = loadTelemetry;

        // Optional deep-link: pitwall.html?raceId=&sessionId=&driverId=
        const params = new URLSearchParams(location.search);
        if (params.get('raceId')) raceSel.value = params.get('raceId');
        if (params.get('driverId')) driverSel.value = params.get('driverId');

        if (races.length) {
          showTrack();
          await loadSessions();
          if (params.get('sessionId')) {
            sessionSel.value = params.get('sessionId');
            loadLapTimes(); loadWeather();
          }
          if (params.get('driverId')) { driverSel.value = params.get('driverId'); loadTelemetry(); }
        }
      } catch (e) {
        showState(document.getElementById('laptimes'), `Could not load races: ${e.message}`, true);
      }
    }

    async function loadSessions() {
      const sessions = await apiGet(`/races/${raceSel.value}/sessions`);
      sessionSel.innerHTML = sessions.map(s => `<option value="${s.id}">${s.type}</option>`).join('');
      if (sessions.length) { loadLapTimes(); loadWeather(); loadTelemetry(); }
      else {
        showState(document.getElementById('laptimes'), 'No sessions for this race.');
        showState(document.getElementById('telemetry'), 'No sessions for this race.');
      }
    }

    async function loadLapTimes() {
      const el = document.getElementById('laptimes');
      showState(el, 'Loading…');
      try {
        const laps = await apiGet(`/sessions/${sessionSel.value}/laptimes`);
        if (!laps.length) return showState(el, 'No lap times recorded for this session.');
        el.innerHTML = `<table class="data-table"><thead><tr>
          <th>Lap</th><th>Driver</th><th>Pos</th><th>Compound</th><th class="num">Time</th>
          </tr></thead><tbody>${laps.map(l => `<tr>
            <td class="num">${l.lapNumber}</td>
            <td>${(l.driver && l.driver.code) || '—'}</td>
            <td>${l.position ?? '-'}</td>
            <td><span class="badge">${l.compound || '—'}</span></td>
            <td class="num">${formatLapTime(l.lapTimeMs)}</td>
          </tr>`).join('')}</tbody></table>`;
      } catch (e) { showState(el, `Could not load lap times: ${e.message}`, true); }
    }

    async function loadTelemetry() {
      const el = document.getElementById('telemetry');
      if (!sessionSel.value || !driverSel.value) return;
      showState(el, 'Loading…');
      try {
        const pts = await apiGet(`/sessions/${sessionSel.value}/telemetry?driverId=${driverSel.value}`);
        if (!pts.length) return showState(el, 'No telemetry for this driver in this session.');
        el.innerHTML = `<table class="data-table"><thead><tr>
          <th>Lap</th><th class="num">Dist (m)</th><th class="num">Speed</th><th class="num">Throttle</th>
          <th class="num">Brake</th><th class="num">Gear</th><th class="num">RPM</th>
          </tr></thead><tbody>${pts.map(p => `<tr>
            <td class="num">${p.lapNumber}</td>
            <td class="num">${p.distanceM != null ? p.distanceM.toFixed(0) : '—'}</td>
            <td class="num">${p.speedKph != null ? p.speedKph.toFixed(0) : '—'}</td>
            <td class="num">${p.throttlePct != null ? p.throttlePct.toFixed(0) + '%' : '—'}</td>
            <td class="num">${p.brake != null ? p.brake.toFixed(2) : '—'}</td>
            <td class="num">${p.gear ?? '—'}</td>
            <td class="num">${p.rpm ?? '—'}</td>
          </tr>`).join('')}</tbody></table>`;
      } catch (e) { showState(el, `Could not load telemetry: ${e.message}`, true); }
    }

    async function loadWeather() {
      const el = document.getElementById('weather-row');
      try {
        const w = await apiGet(`/sessions/${sessionSel.value}/weather`);
        if (!w.length) { el.innerHTML = ''; return; }
        const s = w[0];
        el.innerHTML = `
          <div class="stat"><div class="stat-label">Air Temp</div><div class="stat-value">${s.airTempC ?? '—'}°C</div></div>
          <div class="stat"><div class="stat-label">Track Temp</div><div class="stat-value">${s.trackTempC ?? '—'}°C</div></div>
          <div class="stat"><div class="stat-label">Humidity</div><div class="stat-value">${s.humidityPct ?? '—'}%</div></div>
          <div class="stat"><div class="stat-label">Wind</div><div class="stat-value">${s.windSpeedMs ?? '—'} m/s</div></div>`;
      } catch (e) { el.innerHTML = ''; }
    }

    init();
  </script>
</body>
</html>
