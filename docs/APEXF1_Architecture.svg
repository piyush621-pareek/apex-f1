<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e10600"/>
    </marker>
    <marker id="ah2" markerWidth="12" markerHeight="12" refX="1" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#e10600"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="820" fill="#0a0a0c"/>

  <!-- Title -->
  <text x="800" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#f0f0ee">
    <tspan fill="#e10600">APEX F1</tspan> — System Architecture</text>
  <text x="800" y="82" text-anchor="middle" font-size="16" fill="#9a9a9e">
    Full-stack Java · Spring Boot · MySQL · Multithreaded Race Simulation</text>

  <!-- ============ BROWSER / FRONTEND ============ -->
  <rect x="60" y="150" width="360" height="540" rx="10" fill="#151517" stroke="#2b2b2f"/>
  <rect x="60" y="150" width="360" height="42" rx="10" fill="#1c1c1f"/>
  <rect x="60" y="176" width="360" height="16" fill="#1c1c1f"/>
  <circle cx="86" cy="171" r="5" fill="#e10600"/><circle cx="104" cy="171" r="5" fill="#f5a623"/><circle cx="122" cy="171" r="5" fill="#00d4a0"/>
  <text x="150" y="176" font-size="15" font-weight="600" fill="#f0f0ee">Web UI — Browser</text>
  <text x="80" y="218" font-size="13" fill="#9a9a9e">Frontend: HTML5 · CSS3 · JavaScript (Fetch API)</text>

  <!-- page chips -->
  <g>
    <rect x="80" y="238" width="320" height="60" rx="6" fill="#1c1c1f" stroke="#2b2b2f"/>
    <rect x="80" y="238" width="5" height="60" rx="2" fill="#e10600"/>
    <text x="100" y="266" font-size="16" font-weight="600" fill="#f0f0ee">Dashboard</text>
    <text x="100" y="286" font-size="12" fill="#9a9a9e">driver &amp; constructor standings</text>

    <rect x="80" y="308" width="320" height="60" rx="6" fill="#1c1c1f" stroke="#2b2b2f"/>
    <rect x="80" y="308" width="5" height="60" rx="2" fill="#e10600"/>
    <text x="100" y="336" font-size="16" font-weight="600" fill="#f0f0ee">Pit Wall</text>
    <text x="100" y="356" font-size="12" fill="#9a9a9e">lap times · telemetry · weather · track map</text>

    <rect x="80" y="378" width="320" height="60" rx="6" fill="#1c1c1f" stroke="#2b2b2f"/>
    <rect x="80" y="378" width="5" height="60" rx="2" fill="#e10600"/>
    <text x="100" y="406" font-size="16" font-weight="600" fill="#f0f0ee">FSP</text>
    <text x="100" y="426" font-size="12" fill="#9a9a9e">fan predictions + accuracy</text>

    <rect x="80" y="448" width="320" height="60" rx="6" fill="#1c1c1f" stroke="#2b2b2f"/>
    <rect x="80" y="448" width="5" height="60" rx="2" fill="#e10600"/>
    <text x="100" y="476" font-size="16" font-weight="600" fill="#f0f0ee">Manage</text>
    <text x="100" y="496" font-size="12" fill="#9a9a9e">CRUD admin: drivers · teams · races</text>
  </g>
  <text x="240" y="540" text-anchor="middle" font-size="12" fill="#5c5c60">4 pages · call the API with relative /api URLs</text>

  <!-- Arrow browser <-> backend -->
  <line x1="420" y1="410" x2="558" y2="410" stroke="#e10600" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah2)"/>
  <text x="489" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="#f0f0ee">HTTP + WebSocket</text>
  <text x="489" y="432" text-anchor="middle" font-size="12" fill="#9a9a9e">/api  (JSON)</text>

  <!-- ============ SPRING BOOT APP ============ -->
  <rect x="560" y="120" width="600" height="600" rx="12" fill="#151517" stroke="#00d4a0" stroke-opacity="0.5"/>
  <rect x="560" y="120" width="600" height="46" rx="12" fill="#1c1c1f"/>
  <rect x="560" y="150" width="600" height="16" fill="#1c1c1f"/>
  <text x="580" y="150" font-size="19" font-weight="700" fill="#f0f0ee">Spring Boot Application  ·  :8080</text>
  <text x="580" y="190" font-size="13" fill="#9a9a9e">Serves the frontend from /static (same origin → no CORS)</text>

  <!-- layers -->
  <rect x="588" y="208" width="300" height="70" rx="6" fill="#1c1c1f" stroke="#2b2b2f"/>
  <text x="602" y="236" font-size="16" font-weight="600" fill="#f0f0ee">REST Controllers</text>
  <text x="602" y="258" font-size="12" fill="#9a9a9e">/api endpoints · JSON · error handler</text>

  <line x1="738" y1="278" x2="738" y2="306" stroke="#9a9a9e" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="588" y="308" width="300" height="70" rx="6" fill="#1c1c1f" stroke="#2b2b2f"/>
  <text x="602" y="336" font-size="16" font-weight="600" fill="#f0f0ee">Services</text>
  <text x="602" y="358" font-size="12" fill="#9a9a9e">business logic: CRUD · standings · FSP</text>

  <line x1="738" y1="378" x2="738" y2="406" stroke="#9a9a9e" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="588" y="408" width="300" height="72" rx="6" fill="#1c1c1f" stroke="#2b2b2f"/>
  <text x="602" y="436" font-size="16" font-weight="600" fill="#f0f0ee">Repositories</text>
  <text x="602" y="458" font-size="12" fill="#9a9a9e">Spring Data JPA · Hibernate ORM</text>

  <!-- simulation engine -->
  <rect x="908" y="208" width="224" height="272" rx="6" fill="#12211d" stroke="#00d4a0" stroke-opacity="0.6"/>
  <text x="920" y="234" font-size="15" font-weight="700" fill="#00d4a0">Race Simulation</text>
  <text x="920" y="254" font-size="15" font-weight="700" fill="#00d4a0">Engine</text>
  <text x="920" y="284" font-size="13" fill="#f0f0ee">• Thread per car</text>
  <text x="920" y="308" font-size="13" fill="#f0f0ee">• ExecutorService</text>
  <text x="920" y="332" font-size="13" fill="#f0f0ee">• CountDownLatch</text>
  <text x="920" y="356" font-size="13" fill="#f0f0ee">• Strategy pattern</text>
  <text x="920" y="380" font-size="13" fill="#f0f0ee">• Observer pattern</text>
  <text x="920" y="404" font-size="13" fill="#f0f0ee">• Singleton engine</text>
  <text x="920" y="440" font-size="12" fill="#9a9a9e">Live snapshot via WebSocket</text>
  <text x="920" y="458" font-size="12" fill="#9a9a9e">via REST</text>

  <!-- seed note -->
  <rect x="588" y="512" width="544" height="70" rx="6" fill="#1c1c1f" stroke="#2b2b2f"/>
  <text x="602" y="540" font-size="14" font-weight="600" fill="#f0f0ee">SeedDataRunner — loads full dataset on first run</text>
  <text x="602" y="562" font-size="12" fill="#9a9a9e">11 teams · 22 drivers · 8 circuits · 8 races · standings · telemetry</text>

  <text x="860" y="620" text-anchor="middle" font-size="12" fill="#5c5c60">Java 17 · Spring Boot 3.3 · Lombok · Maven</text>

  <!-- Arrow backend <-> db -->
  <line x1="1160" y1="440" x2="1236" y2="440" stroke="#e10600" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah2)"/>
  <text x="1198" y="426" text-anchor="middle" font-size="13" font-weight="600" fill="#f0f0ee">JDBC</text>

  <!-- ============ MYSQL ============ -->
  <path d="M1240,290 L1240,600 A150,26 0 0 0 1540,600 L1540,290 Z" fill="#151517" stroke="#1E5BC6" stroke-opacity="0.7"/>
  <ellipse cx="1390" cy="290" rx="150" ry="26" fill="#1c1c1f" stroke="#1E5BC6" stroke-opacity="0.7"/>
  <text x="1390" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#f0f0ee">MySQL Database</text>
  <text x="1390" y="296" text-anchor="middle" font-size="14" font-weight="600" fill="#64C4FF">apexf1</text>

  <g font-size="13" fill="#c8c8cc">
    <text x="1270" y="332">• teams</text>
    <text x="1270" y="356">• drivers</text>
    <text x="1270" y="380">• circuits</text>
    <text x="1270" y="404">• races</text>
    <text x="1270" y="428">• sessions</text>
    <text x="1270" y="452">• lap_times</text>
    <text x="1410" y="332">• telemetry_points</text>
    <text x="1410" y="356">• weather_samples</text>
    <text x="1410" y="380">• driver_standings</text>
    <text x="1410" y="404">• team_standings</text>
    <text x="1410" y="428">• predictions</text>
    <text x="1410" y="452" fill="#5c5c60">11 tables</text>
  </g>

  <!-- footer legend -->
  <text x="800" y="792" text-anchor="middle" font-size="12" fill="#5c5c60">Request flow:  Browser → REST Controllers → Services → Repositories (JPA) → MySQL   ·   responses return as JSON</text>
</svg>
