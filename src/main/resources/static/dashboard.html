<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APEX F1 — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="dashboard">

  <header class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">APEX<span class="brand-name-accent">F1</span></span>
      </a>
      <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
      <nav class="nav-links">
        <a href="dashboard.html" class="nav-link" data-page="dashboard">Dashboard</a>
        <a href="pitwall.html" class="nav-link" data-page="pitwall">Pit Wall</a>
        <a href="fsp.html" class="nav-link" data-page="fsp">FSP</a>
        <a href="manage.html" class="nav-link" data-page="manage">Manage</a>
      </nav>
      <div class="season-badge"><span class="season-dot"></span>2026 SEASON</div>
    </div>
  </header>

  <main class="page-container">
    <section class="panel">
      <h1>Dashboard</h1>
      <p class="text-secondary">Live championship standings for the 2026 season, served from the APEX F1 API.</p>
      <div class="grid grid-2" id="stat-row" style="margin-top:20px;"></div>
    </section>

    <div class="grid grid-2">
      <section class="panel">
        <h2>Driver Standings</h2>
        <div id="driver-standings"><div class="state-msg">Loading…</div></div>
      </section>
      <section class="panel">
        <h2>Constructor Standings</h2>
        <div id="team-standings"><div class="state-msg">Loading…</div></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>APEX F1 — F1 Telemetry Analytics · 2026 Season</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script>
    function driverRow(s) {
      const d = s.driver || {};
      const t = d.team || {};
      const head = d.headshotUrl
        ? `<img src="${d.headshotUrl}" alt="${d.code}" class="avatar" style="border-color:${t.colorHex || '#888'}">`
        : `<span class="team-dot" style="background:${t.colorHex || '#888'}"></span>`;
      return `<tr>
        <td><span class="pos ${s.position === 1 ? 'p1' : ''}">${s.position ?? '-'}</span></td>
        <td><div class="cell-with-img">${head}<span>${d.fullName || '—'} <span class="badge">${d.code || ''}</span></span></div></td>
        <td class="text-secondary">${t.name || '—'}</td>
        <td class="num">${s.wins ?? 0}</td>
        <td class="num">${s.points ?? 0}</td>
      </tr>`;
    }
    function teamRow(s) {
      const t = s.team || {};
      const logo = t.logoUrl
        ? `<img src="${t.logoUrl}" alt="${t.shortName}" class="logo">`
        : `<span class="team-dot" style="background:${t.colorHex || '#888'}"></span>`;
      return `<tr>
        <td><span class="pos ${s.position === 1 ? 'p1' : ''}">${s.position ?? '-'}</span></td>
        <td><div class="cell-with-img">${logo}<span>${t.name || '—'} <span class="badge">${t.shortName || ''}</span></span></div></td>
        <td class="num">${s.wins ?? 0}</td>
        <td class="num">${s.points ?? 0}</td>
      </tr>`;
    }

    async function load() {
      const dEl = document.getElementById('driver-standings');
      const tEl = document.getElementById('team-standings');
      try {
        const [drivers, teams] = await Promise.all([
          apiGet(`/standings/drivers?season=${SEASON}`),
          apiGet(`/standings/teams?season=${SEASON}`),
        ]);

        dEl.innerHTML = `<table class="data-table"><thead><tr>
          <th>Pos</th><th>Driver</th><th>Team</th><th class="num">Wins</th><th class="num">Pts</th>
          </tr></thead><tbody>${drivers.map(driverRow).join('')}</tbody></table>`;

        tEl.innerHTML = `<table class="data-table"><thead><tr>
          <th>Pos</th><th>Constructor</th><th class="num">Wins</th><th class="num">Pts</th>
          </tr></thead><tbody>${teams.map(teamRow).join('')}</tbody></table>`;

        const leader = drivers[0] || {};
        const topTeam = teams[0] || {};
        document.getElementById('stat-row').innerHTML = `
          <div class="stat"><div class="stat-label">Championship Leader</div>
            <div class="stat-value">${(leader.driver && leader.driver.fullName) || '—'}</div></div>
          <div class="stat"><div class="stat-label">Leading Constructor</div>
            <div class="stat-value">${(topTeam.team && topTeam.team.name) || '—'}</div></div>`;
      } catch (e) {
        showState(dEl, `Could not load standings: ${e.message}`, true);
        showState(tEl, `Could not load standings: ${e.message}`, true);
      }
    }
    load();
  </script>
</body>
</html>
