<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APEX F1 — Manage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab { padding: 9px 18px; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg-panel); color: var(--text-secondary); cursor: pointer;
      font-family: var(--font-display); font-weight: 600; letter-spacing: 0.03em; }
    .tab.active { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }
    .tab-panel[hidden] { display: none; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    .actions-cell { white-space: nowrap; }
    .actions-cell .btn { padding: 5px 10px; }
  </style>
</head>
<body data-page="manage">

  <header class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">APEX<span class="brand-name-accent">F1</span></span>
      </a>
      <button class="nav-toggle" aria-label="Toggle navigation">&#9776;</button>
      <nav class="nav-links">
        <a href="dashboard.html" class="nav-link" data-page="dashboard">Dashboard</a>
        <a href="pitwall.html" class="nav-link" data-page="pitwall">Pit Wall</a>
        <a href="race.html" class="nav-link" data-page="race">Race Sim</a>
        <a href="fsp.html" class="nav-link" data-page="fsp">FSP</a>
        <a href="manage.html" class="nav-link" data-page="manage">Manage</a>
      </nav>
      <div class="season-badge"><span class="season-dot"></span>2026 SEASON</div>
    </div>
  </header>

  <main class="page-container">
    <section class="panel">
      <h1>Manage Data</h1>
      <p class="text-secondary">Full create / read / update / delete for the core entities, backed by the MySQL database.</p>
      <div class="tabs">
        <button class="tab active" data-tab="drivers">Drivers</button>
        <button class="tab" data-tab="teams">Teams</button>
        <button class="tab" data-tab="races">Races</button>
      </div>
    </section>

    <!-- DRIVERS -->
    <div class="tab-panel" data-panel="drivers">
      <section class="panel">
        <h2 id="drivers-form-title">Add Driver</h2>
        <form id="drivers-form">
          <input type="hidden" id="d-id" />
          <div class="form-grid">
            <div class="field"><label>Code (3 letters)</label><input id="d-code" maxlength="3" required /></div>
            <div class="field"><label>Full Name</label><input id="d-fullName" required /></div>
            <div class="field"><label>Car Number</label><input id="d-carNumber" type="number" /></div>
            <div class="field"><label>Nationality</label><input id="d-nationality" /></div>
            <div class="field"><label>Team</label><select id="d-team"></select></div>
          </div>
          <div style="margin-top:16px;display:flex;gap:10px;">
            <button type="submit" class="btn">Save Driver</button>
            <button type="button" class="btn secondary" onclick="resetForm('drivers')">Clear</button>
          </div>
          <div id="drivers-msg" style="margin-top:12px;"></div>
        </form>
      </section>
      <section class="panel">
        <h2>Drivers</h2>
        <div id="drivers-list"><div class="state-msg">Loading…</div></div>
      </section>
    </div>

    <!-- TEAMS -->
    <div class="tab-panel" data-panel="teams" hidden>
      <section class="panel">
        <h2 id="teams-form-title">Add Team</h2>
        <form id="teams-form">
          <input type="hidden" id="t-id" />
          <div class="form-grid">
            <div class="field"><label>Name</label><input id="t-name" required /></div>
            <div class="field"><label>Short Name (3 letters)</label><input id="t-shortName" maxlength="3" required /></div>
            <div class="field"><label>Nationality</label><input id="t-nationality" /></div>
            <div class="field"><label>Color (hex, e.g. #E10600)</label><input id="t-colorHex" /></div>
          </div>
          <div style="margin-top:16px;display:flex;gap:10px;">
            <button type="submit" class="btn">Save Team</button>
            <button type="button" class="btn secondary" onclick="resetForm('teams')">Clear</button>
          </div>
          <div id="teams-msg" style="margin-top:12px;"></div>
        </form>
      </section>
      <section class="panel">
        <h2>Teams</h2>
        <div id="teams-list"><div class="state-msg">Loading…</div></div>
      </section>
    </div>

    <!-- RACES -->
    <div class="tab-panel" data-panel="races" hidden>
      <section class="panel">
        <h2 id="races-form-title">Add Race</h2>
        <form id="races-form">
          <input type="hidden" id="r-id" />
          <div class="form-grid">
            <div class="field"><label>Season</label><input id="r-season" type="number" value="2026" required /></div>
            <div class="field"><label>Round</label><input id="r-round" type="number" required /></div>
            <div class="field"><label>Name</label><input id="r-name" required /></div>
            <div class="field"><label>Race Date</label><input id="r-raceDate" type="date" /></div>
            <div class="field"><label>Circuit</label><select id="r-circuit"></select></div>
            <div class="field"><label>Actual Pole Driver</label><select id="r-pole"></select></div>
            <div class="field"><label>Actual Winner Driver</label><select id="r-winner"></select></div>
            <div class="field"><label>Completed</label>
              <select id="r-completed"><option value="false">No</option><option value="true">Yes</option></select></div>
          </div>
          <div style="margin-top:16px;display:flex;gap:10px;">
            <button type="submit" class="btn">Save Race</button>
            <button type="button" class="btn secondary" onclick="resetForm('races')">Clear</button>
          </div>
          <div id="races-msg" style="margin-top:12px;"></div>
        </form>
      </section>
      <section class="panel">
        <h2>Races</h2>
        <div id="races-list"><div class="state-msg">Loading…</div></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p>APEX F1 — F1 Telemetry Analytics · 2026 Season</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script>
    let teams = [], drivers = [], circuits = [];

    // ---- Tabs ----
    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.tab-panel').forEach(p => p.hidden = p.dataset.panel !== tab.dataset.tab);
      };
    });

    const opt = (v, label, sel) => `<option value="${v}" ${sel ? 'selected' : ''}>${label}</option>`;
    const blank = (label) => `<option value="">— ${label} —</option>`;

    function msg(entity, text, ok) {
      document.getElementById(entity + '-msg').innerHTML =
        `<span style="color:${ok ? 'var(--accent-teal)' : 'var(--accent-red)'}">${text}</span>`;
    }

    // ==================== DRIVERS ====================
    async function loadDrivers() {
      const el = document.getElementById('drivers-list');
      try {
        drivers = await apiGet('/drivers');
        document.getElementById('d-team').innerHTML = blank('No team') + teams.map(t => opt(t.id, t.name)).join('');
        el.innerHTML = `<table class="data-table"><thead><tr>
          <th>Code</th><th>Name</th><th>No.</th><th>Nationality</th><th>Team</th><th></th>
          </tr></thead><tbody>${drivers.map(d => `<tr>
            <td>${d.headshotUrl ? `<img src="${d.headshotUrl}" alt="${d.code}" class="avatar-sm">` : ''} <span class="badge">${d.code}</span></td>
            <td>${d.fullName}</td>
            <td class="num">${d.carNumber ?? '—'}</td>
            <td class="text-secondary">${d.nationality || '—'}</td>
            <td>${(d.team && d.team.name) || '—'}</td>
            <td class="actions-cell">
              <button class="btn secondary" onclick="editDriver(${d.id})">Edit</button>
              <button class="btn secondary" onclick="deleteDriver(${d.id})">Delete</button>
            </td></tr>`).join('')}</tbody></table>`;
      } catch (e) { showState(el, `Could not load drivers: ${e.message}`, true); }
    }
    window.editDriver = (id) => {
      const d = drivers.find(x => x.id === id); if (!d) return;
      document.getElementById('d-id').value = d.id;
      document.getElementById('d-code').value = d.code || '';
      document.getElementById('d-fullName').value = d.fullName || '';
      document.getElementById('d-carNumber').value = d.carNumber ?? '';
      document.getElementById('d-nationality').value = d.nationality || '';
      document.getElementById('d-team').value = (d.team && d.team.id) || '';
      document.getElementById('drivers-form-title').textContent = 'Edit Driver #' + d.id;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    window.deleteDriver = async (id) => {
      if (!confirm('Delete this driver?')) return;
      try { await apiDelete('/drivers/' + id); loadDrivers(); }
      catch (e) { msg('drivers', 'Error: ' + e.message, false); }
    };
    document.getElementById('drivers-form').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('d-id').value;
      const teamId = document.getElementById('d-team').value;
      const body = {
        code: document.getElementById('d-code').value.trim().toUpperCase(),
        fullName: document.getElementById('d-fullName').value.trim(),
        carNumber: document.getElementById('d-carNumber').value ? Number(document.getElementById('d-carNumber').value) : null,
        nationality: document.getElementById('d-nationality').value.trim() || null,
        team: teamId ? { id: Number(teamId) } : null,
      };
      try {
        if (id) await apiPut('/drivers/' + id, body); else await apiPost('/drivers', body);
        msg('drivers', 'Saved!', true); resetForm('drivers'); loadDrivers();
      } catch (err) { msg('drivers', 'Error: ' + err.message, false); }
    };

    // ==================== TEAMS ====================
    async function loadTeams() {
      const el = document.getElementById('teams-list');
      try {
        teams = await apiGet('/teams');
        el.innerHTML = `<table class="data-table"><thead><tr>
          <th>Name</th><th>Short</th><th>Nationality</th><th>Color</th><th></th>
          </tr></thead><tbody>${teams.map(t => `<tr>
            <td><span class="team-dot" style="background:${t.colorHex || '#888'}"></span>${t.name}</td>
            <td><span class="badge">${t.shortName}</span></td>
            <td class="text-secondary">${t.nationality || '—'}</td>
            <td class="mono">${t.colorHex || '—'}</td>
            <td class="actions-cell">
              <button class="btn secondary" onclick="editTeam(${t.id})">Edit</button>
              <button class="btn secondary" onclick="deleteTeam(${t.id})">Delete</button>
            </td></tr>`).join('')}</tbody></table>`;
      } catch (e) { showState(el, `Could not load teams: ${e.message}`, true); }
    }
    window.editTeam = (id) => {
      const t = teams.find(x => x.id === id); if (!t) return;
      document.getElementById('t-id').value = t.id;
      document.getElementById('t-name').value = t.name || '';
      document.getElementById('t-shortName').value = t.shortName || '';
      document.getElementById('t-nationality').value = t.nationality || '';
      document.getElementById('t-colorHex').value = t.colorHex || '';
      document.getElementById('teams-form-title').textContent = 'Edit Team #' + t.id;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    window.deleteTeam = async (id) => {
      if (!confirm('Delete this team?')) return;
      try { await apiDelete('/teams/' + id); loadTeams(); loadDrivers(); }
      catch (e) { msg('teams', 'Error: ' + e.message, false); }
    };
    document.getElementById('teams-form').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('t-id').value;
      const body = {
        name: document.getElementById('t-name').value.trim(),
        shortName: document.getElementById('t-shortName').value.trim().toUpperCase(),
        nationality: document.getElementById('t-nationality').value.trim() || null,
        colorHex: document.getElementById('t-colorHex').value.trim() || null,
      };
      try {
        if (id) await apiPut('/teams/' + id, body); else await apiPost('/teams', body);
        msg('teams', 'Saved!', true); resetForm('teams'); loadTeams();
      } catch (err) { msg('teams', 'Error: ' + err.message, false); }
    };

    // ==================== RACES ====================
    async function loadRaces() {
      const el = document.getElementById('races-list');
      try {
        circuits = await apiGet('/circuits');
        const races = await apiGet('/races?season=2026');
        window._races = races;
        document.getElementById('r-circuit').innerHTML = blank('No circuit') + circuits.map(c => opt(c.id, c.name)).join('');
        const driverOpts = blank('None') + drivers.map(d => opt(d.id, d.code + ' — ' + d.fullName)).join('');
        document.getElementById('r-pole').innerHTML = driverOpts;
        document.getElementById('r-winner').innerHTML = driverOpts;
        el.innerHTML = `<table class="data-table"><thead><tr>
          <th>Rnd</th><th>Name</th><th>Date</th><th>Circuit</th><th>Done</th><th></th>
          </tr></thead><tbody>${races.map(r => `<tr>
            <td class="num">${r.round}</td>
            <td>${r.name}</td>
            <td class="text-secondary">${r.raceDate || '—'}</td>
            <td class="text-secondary">${(r.circuit && r.circuit.name) || '—'}</td>
            <td>${r.completed ? '<span class="badge">yes</span>' : '—'}</td>
            <td class="actions-cell">
              <button class="btn secondary" onclick="editRace(${r.id})">Edit</button>
              <button class="btn secondary" onclick="deleteRace(${r.id})">Delete</button>
            </td></tr>`).join('')}</tbody></table>`;
      } catch (e) { showState(el, `Could not load races: ${e.message}`, true); }
    }
    window.editRace = (id) => {
      const r = (window._races || []).find(x => x.id === id); if (!r) return;
      document.getElementById('r-id').value = r.id;
      document.getElementById('r-season').value = r.season ?? 2026;
      document.getElementById('r-round').value = r.round ?? '';
      document.getElementById('r-name').value = r.name || '';
      document.getElementById('r-raceDate').value = r.raceDate || '';
      document.getElementById('r-circuit').value = (r.circuit && r.circuit.id) || '';
      document.getElementById('r-pole').value = (r.actualPoleDriver && r.actualPoleDriver.id) || '';
      document.getElementById('r-winner').value = (r.actualWinnerDriver && r.actualWinnerDriver.id) || '';
      document.getElementById('r-completed').value = String(!!r.completed);
      document.getElementById('races-form-title').textContent = 'Edit Race #' + r.id;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    window.deleteRace = async (id) => {
      if (!confirm('Delete this race?')) return;
      try { await apiDelete('/races/' + id); loadRaces(); }
      catch (e) { msg('races', 'Error: ' + e.message, false); }
    };
    document.getElementById('races-form').onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('r-id').value;
      const circuitId = document.getElementById('r-circuit').value;
      const poleId = document.getElementById('r-pole').value;
      const winnerId = document.getElementById('r-winner').value;
      const body = {
        season: Number(document.getElementById('r-season').value),
        round: Number(document.getElementById('r-round').value),
        name: document.getElementById('r-name').value.trim(),
        raceDate: document.getElementById('r-raceDate').value || null,
        completed: document.getElementById('r-completed').value === 'true',
        circuit: circuitId ? { id: Number(circuitId) } : null,
        actualPoleDriver: poleId ? { id: Number(poleId) } : null,
        actualWinnerDriver: winnerId ? { id: Number(winnerId) } : null,
      };
      try {
        if (id) await apiPut('/races/' + id, body); else await apiPost('/races', body);
        msg('races', 'Saved!', true); resetForm('races'); loadRaces();
      } catch (err) { msg('races', 'Error: ' + err.message, false); }
    };

    // ---- Shared reset ----
    window.resetForm = (entity) => {
      const map = { drivers: 'Add Driver', teams: 'Add Team', races: 'Add Race' };
      document.getElementById(entity + '-form').reset();
      const idField = { drivers: 'd-id', teams: 't-id', races: 'r-id' }[entity];
      document.getElementById(idField).value = '';
      document.getElementById(entity + '-form-title').textContent = map[entity];
      document.getElementById(entity + '-msg').innerHTML = '';
      if (entity === 'races') document.getElementById('r-season').value = 2026;
    };

    // ---- Boot: teams first (drivers form needs them), then drivers, then races ----
    (async () => {
      await loadTeams();
      await loadDrivers();
      await loadRaces();
    })();
  </script>
</body>
</html>
