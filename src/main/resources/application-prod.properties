# ==========================================
# APEX F1 — Production Configuration Profile
# Run with: java -jar target/apex-f1-backend.jar --spring.profiles.active=prod
# ==========================================

spring.application.name=apex-f1-backend
server.port=${PORT:8080}

# Production datasource configured via environment variables with local fallback
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/apexf1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# HikariCP production connection pool tuning
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HTTP response compression for telemetry & static SVG/JS assets
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml
server.error.include-message=always
