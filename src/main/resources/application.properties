# ==========================================
# APEX F1 backend configuration
# Update datasource username/password to match your local MySQL install.
# ==========================================

spring.application.name=apex-f1-backend
server.port=8080

# Creates the "apexf1" database automatically if it doesn't exist yet
spring.datasource.url=jdbc:mysql://localhost:3306/apexf1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
# Password comes from the DB_PASSWORD environment variable, or from the git-ignored
# file application-local.properties (copy application-local.properties.example).
spring.config.import=optional:classpath:application-local.properties
spring.datasource.password=${DB_PASSWORD}

# Auto-creates/updates tables from the entity classes below
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Return clean JSON error bodies instead of whitelabel error pages
server.error.include-message=always
