<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e10600"/>
    </marker>
    <marker id="ah2" markerWidth="12" markerHeight="12" refX="1" refY="5" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#e10600"/>
    </marker>
    <marker id="ahg" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b70"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="820" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#1a1a1f">
    <tspan fill="#e10600">APEX F1</tspan> — System Architecture</text>
  <text x="800" y="82" text-anchor="middle" font-size="16" fill="#6b6b70">
    Full-stack Java · Spring Boot · MySQL · Multithreaded Race Simulation</text>

  <!-- ============ BROWSER / FRONTEND ============ -->
  <rect x="60" y="150" width="360" height="540" rx="10" fill="#f5f5f7" stroke="#d0d0d5"/>
  <rect x="60" y="150" width="360" height="42" rx="10" fill="#ececee"/>
  <rect x="60" y="176" width="360" height="16" fill="#ececee"/>
  <circle cx="86" cy="171" r="5" fill="#e10600"/><circle cx="104" cy="171" r="5" fill="#f5a623"/><circle cx="122" cy="171" r="5" fill="#00b98d"/>
  <text x="150" y="176" font-size="15" font-weight="600" fill="#1a1a1f">Web UI — Browser</text>
  <text x="80" y="218" font-size="13" fill="#6b6b70">Frontend: HTML5 · CSS3 · JavaScript (Fetch API)</text>

  <!-- page chips -->
  <g>
    <rect x="80" y="238" width="320" height="60" rx="6" fill="#ffffff" stroke="#d0d0d5"/>
    <rect x="80" y="238" width="5" height="60" rx="2" fill="#e10600"/>
    <text x="100" y="266" font-size="16" font-weight="600" fill="#1a1a1f">Dashboard</text>
    <text x="100" y="286" font-size="12" fill="#6b6b70">driver &amp; constructor standings</text>

    <rect x="80" y="308" width="320" height="60" rx="6" fill="#ffffff" stroke="#d0d0d5"/>
    <rect x="80" y="308" width="5" height="60" rx="2" fill="#e10600"/>
    <text x="100" y="336" font-size="16" font-weight="600" fill="#1a1a1f">Pit Wall</text>
    <text x="100" y="356" font-size="12" fill="#6b6b70">lap times · telemetry · weather · track map</text>

    <rect x="80" y="378" width="320" height="60" rx="6" fill="#ffffff" stroke="#d0d0d5"/>
    <rect x="80" y="378" width="5" height="60" rx="2" fill="#e10600"/>
    <text x="100" y="406" font-size="16" font-weight="600" fill="#1a1a1f">FSP</text>
    <text x="100" y="426" font-size="12" fill="#6b6b70">fan predictions + accuracy</text>

    <rect x="80" y="448" width="320" height="60" rx="6" fill="#ffffff" stroke="#d0d0d5"/>
    <rect x="80" y="448" width="5" height="60" rx="2" fill="#e10600"/>
    <text x="100" y="476" font-size="16" font-weight="600" fill="#1a1a1f">Manage</text>
    <text x="100" y="496" font-size="12" fill="#6b6b70">CRUD admin: drivers · teams · races</text>
    <rect x="80" y="518" width="320" height="60" rx="6" fill="#ffffff" stroke="#d0d0d5"/>
    <rect x="80" y="518" width="5" height="60" rx="2" fill="#e10600"/>
    <text x="100" y="546" font-size="16" font-weight="600" fill="#1a1a1f">Race Sim</text>
    <text x="100" y="566" font-size="12" fill="#6b6b70">live cars on the circuit (WebSocket push)</text>
  </g>
  <text x="240" y="612" text-anchor="middle" font-size="12" fill="#9a9a9e">5 pages · call the API with relative /api URLs</text>

  <!-- Arrow browser <-> backend -->
  <line x1="420" y1="410" x2="558" y2="410" stroke="#e10600" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah2)"/>
  <text x="489" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1f">HTTP + WebSocket</text>
  <text x="489" y="432" text-anchor="middle" font-size="12" fill="#6b6b70">/api  (JSON)</text>

  <!-- ============ SPRING BOOT APP ============ -->
  <rect x="560" y="120" width="600" height="600" rx="12" fill="#f5f5f7" stroke="#00b98d"/>
  <rect x="560" y="120" width="600" height="46" rx="12" fill="#ececee"/>
  <rect x="560" y="150" width="600" height="16" fill="#ececee"/>
  <text x="580" y="150" font-size="19" font-weight="700" fill="#1a1a1f">Spring Boot Application  ·  :8080</text>
  <text x="580" y="190" font-size="13" fill="#6b6b70">Serves the frontend from /static (same origin → no CORS)</text>

  <!-- layers -->
  <rect x="588" y="208" width="300" height="70" rx="6" fill="#ffffff" stroke="#d0d0d5"/>
  <text x="602" y="236" font-size="16" font-weight="600" fill="#1a1a1f">REST Controllers</text>
  <text x="602" y="258" font-size="12" fill="#6b6b70">/api endpoints · JSON · error handler</text>

  <line x1="738" y1="278" x2="738" y2="306" stroke="#6b6b70" stroke-width="2" marker-end="url(#ahg)"/>

  <rect x="588" y="308" width="300" height="70" rx="6" fill="#ffffff" stroke="#d0d0d5"/>
  <text x="602" y="336" font-size="16" font-weight="600" fill="#1a1a1f">Services</text>
  <text x="602" y="358" font-size="12" fill="#6b6b70">business logic: CRUD · standings · FSP</text>

  <line x1="738" y1="378" x2="738" y2="406" stroke="#6b6b70" stroke-width="2" marker-end="url(#ahg)"/>

  <rect x="588" y="408" width="300" height="72" rx="6" fill="#ffffff" stroke="#d0d0d5"/>
  <text x="602" y="436" font-size="16" font-weight="600" fill="#1a1a1f">Repositories</text>
  <text x="602" y="458" font-size="12" fill="#6b6b70">Spring Data JPA · Hibernate ORM</text>

  <!-- simulation engine -->
  <rect x="908" y="208" width="224" height="272" rx="6" fill="#e6f6f1" stroke="#00b98d"/>
  <text x="920" y="234" font-size="15" font-weight="700" fill="#00876a">Race Simulation</text>
  <text x="920" y="254" font-size="15" font-weight="700" fill="#00876a">Engine</text>
  <text x="920" y="284" font-size="13" fill="#1a1a1f">• Thread per car</text>
  <text x="920" y="308" font-size="13" fill="#1a1a1f">• ExecutorService</text>
  <text x="920" y="332" font-size="13" fill="#1a1a1f">• CountDownLatch</text>
  <text x="920" y="356" font-size="13" fill="#1a1a1f">• Strategy pattern</text>
  <text x="920" y="380" font-size="13" fill="#1a1a1f">• Observer pattern</text>
  <text x="920" y="404" font-size="13" fill="#1a1a1f">• Singleton engine</text>
  <text x="920" y="440" font-size="12" fill="#6b6b70">Results saved to</text>
  <text x="920" y="458" font-size="12" fill="#6b6b70">MySQL on finish</text>

  <!-- seed note -->
  <rect x="588" y="512" width="544" height="70" rx="6" fill="#ffffff" stroke="#d0d0d5"/>
  <text x="602" y="540" font-size="14" font-weight="600" fill="#1a1a1f">SeedDataRunner — seeds 8 full race weekends on first run</text>
  <text x="602" y="562" font-size="12" fill="#6b6b70">2026 grid · 16 sessions · ~10.5k laps · ~28k telemetry points</text>

  <text x="860" y="620" text-anchor="middle" font-size="12" fill="#9a9a9e">Java 17 · Spring Boot 3.3 · Lombok · Maven</text>

  <!-- Arrow backend <-> db -->
  <line x1="1160" y1="440" x2="1236" y2="440" stroke="#e10600" stroke-width="3" marker-end="url(#ah)" marker-start="url(#ah2)"/>
  <text x="1198" y="426" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1f">JDBC</text>

  <!-- ============ MYSQL ============ -->
  <path d="M1240,290 L1240,600 A150,26 0 0 0 1540,600 L1540,290 Z" fill="#eef3fb" stroke="#1E5BC6"/>
  <ellipse cx="1390" cy="290" rx="150" ry="26" fill="#dfeafc" stroke="#1E5BC6"/>
  <text x="1390" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1f">MySQL Database</text>
  <text x="1390" y="296" text-anchor="middle" font-size="14" font-weight="600" fill="#1E5BC6">apexf1</text>

  <g font-size="13" fill="#33333a">
    <text x="1270" y="332">• teams</text>
    <text x="1270" y="356">• drivers</text>
    <text x="1270" y="380">• circuits</text>
    <text x="1270" y="404">• races</text>
    <text x="1270" y="428">• sessions</text>
    <text x="1270" y="452">• lap_times</text>
    <text x="1410" y="332">• telemetry_points</text>
    <text x="1410" y="356">• weather_samples</text>
    <text x="1410" y="380">• driver_standings</text>
    <text x="1410" y="404">• team_standings</text>
    <text x="1410" y="428">• predictions</text>
    <text x="1410" y="452">• simulation_results</text>
    <text x="1270" y="476">• sim_result_entries</text>
    <text x="1410" y="476" fill="#9a9a9e">13 tables</text>
  </g>

  <!-- footer legend -->
  <text x="800" y="792" text-anchor="middle" font-size="12" fill="#9a9a9e">Request flow:  Browser → REST Controllers → Services → Repositories (JPA) → MySQL   ·   responses return as JSON</text>
</svg>
